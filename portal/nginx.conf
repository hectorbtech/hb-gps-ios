server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com https://www.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;

  # La ingesta interna (Traccar -> API) nunca se publica.
  location /internal/ { return 404; }

  # Flujo en vivo (SSE): sin búfer y con lectura larga para que las posiciones lleguen al instante.
  location = /api/stream {
    proxy_pass http://api:8780;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    proxy_pass http://api:8780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  # El service worker se revisa siempre (si se cachea, una versión nueva no llegaría nunca).
  location = /hbgps-sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; default_type application/javascript; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # Política de privacidad pública (la pide Google Play): https://hectorgps.com/privacidad
  location = /privacidad { try_files /privacidad.html =404; }
  # Soporte y eliminacion de cuenta (lo piden App Store y Google Play): https://hectorgps.com/soporte
  location = /soporte { try_files /soporte.html =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
